[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ipfs_kit_py", "ipfs_kit_py.*"]
exclude = [
    "ipfs_accelerate_py*",
    "ipfs_datasets_py*",
    "external*",
    "ipfs_kit_py.tests*",
]

[tool.setuptools.package-data]
"ipfs_kit_py" = ["**/*"]

# Developer-local daemon downloads are runtime state, never Python package
# data.  Keep the broad legacy package-data rule above for compatibility while
# explicitly excluding executable/cache/credential material from wheels.
[tool.setuptools.exclude-package-data]
"*" = [
    "**/__pycache__/*",
    "**/*.pyc",
    "**/*.pyo",
]
"ipfs_kit_py" = [
    "bin/*",
    "bin/**/*",
    "**/*.receipt.json",
    "**/*.key",
    "**/*.pem",
]

[tool.black]
line-length = 100
target-version = ["py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", "__pycache__", "build", "dist"]
ignore = ["E203", "E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # Allow unused imports in __init__.py files

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "build/coverage/iroh-html"

[tool.coverage.xml]
output = "build/coverage/iroh-coverage.xml"

[tool.coverage.json]
output = "build/coverage/iroh-coverage.json"
