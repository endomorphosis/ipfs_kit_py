[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipfs_kit_py"
version = "0.3.0"
authors = [
  { name="Benjamin Barber", email="starworks5@gmail.com" },
]
description = "Python toolkit for IPFS with high-level API, cluster management, tiered storage, and AI/ML integration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}
keywords = ["ipfs", "distributed", "storage", "content-addressed", "cluster", "arrow", "fsspec", "ai", "ml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    # Architecture support
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "requests>=2.28.0",
    "httpx>=0.24.0",  # For async HTTP requests
    "aiohttp>=3.8.4",  # For async HTTP operations
    "aiofiles>=23.1.0",  # For async file operations
    "watchdog>=3.0.0",  # For file system monitoring
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "jsonpatch>=1.33",
    "base58>=2.1.1",
    "multiaddr>=0.0.9",  # For libp2p multiaddress support
    "multiformats>=0.2.0",  # For CIDs/multicodecs (required by libp2p)
    "python-magic>=0.4.27", # For file type detection
    "anyio>=3.7.0", # For async operations with backend flexibility
    "hypercorn>=0.16.0", # Trio-native ASGI server for MCP++ HTTP transport
    "trio>=0.22.0", # Optional backend for anyio
    "cryptography>=38.0.0", # Required for libp2p
    "cffi>=1.16.0",
    "protobuf>=5.26.0,<7.0.0",  # libp2p main generated *_pb2 compatibility
    "eth-hash[pycryptodome]>=0.3.3",  # ETH integration with crypto backend
    "eth-keys>=0.4.0",  # ETH integration for key management
    "toml",
]

[project.optional-dependencies]
# The proof-context core is a hermetic local CAS/WAL/receipt provider.  Remote
# IPFS is an explicit opt-in surface and uses injected clients, so this marker
# intentionally carries no daemon/client dependency into ordinary installs.
proof-context-ipfs = []
graphrag = [
    "networkx>=3.0",
    "numpy>=1.20.0",
    "faiss-cpu>=1.8.0",
    "ipfs_datasets_py",
]
mcp = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "jinja2>=3.1.0",
    "mcp>=1.0.0",
]
iroh = [
    "blake3>=0.4.1",
    "duckdb>=1.4.0",
]
# Optional FUSE binding for kernel VFS mounts (Linux libfuse / Windows WinFsp).
# Default installs must remain inert: fusepy is never a core dependency because
# importing it loads a native library. Pin is exact for reproducible wheels.
fuse = [
    "fusepy==3.0.1",
]
transformers = [
    "transformers>=4.20.0",
    "huggingface-hub>=0.10.0"
]
fsspec = [
    "fsspec>=2023.3.0",
    "requests-unixsocket>=0.3.0",
]
arrow = [
    "pyarrow>=11.0.0",  # Updated minimum version to be more compatible
    "pandas>=1.3.0",
]
libp2p = [
    # Source-checkout development extra only. Not the PCPR-051 release profile.
    "libp2p @ git+https://github.com/libp2p/py-libp2p.git@main",  # Track upstream main (moving target)
    "multiaddr>=0.0.9",  # For peer addressing
    "multiformats>=0.2.0",  # For content addressing
    "base58>=2.1.1",  # Used by CIDs and peer IDs
    "cryptography>=38.0.0",  # For key generation and encryption
    "protobuf>=5.26.0,<7.0.0",  # Needed for current py-libp2p main generated *_pb2 code
    "eth-hash[pycryptodome]>=0.3.3",  # ETH integration with crypto backend
    "eth-keys>=0.4.0",  # ETH integration for key management
]
ai_ml = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
    "faiss-cpu>=1.8.0",
    "mmh3>=3.0.0", # Updated for compatibility
]
huggingface = [
    "huggingface_hub>=0.19.0",
]
filecoin_pin = [
    "httpx>=0.24.0",
    "multiformats>=0.3.0",
]
car_files = [
    "dag-cbor>=0.3.0",
    "cbor2>=5.4.0",
]
saturn = [
    "httpx>=0.24.0",
]
ipni = [
    "httpx>=0.24.0",
    "multiformats>=0.3.0",
]
enhanced_ipfs = [
    "multiformats>=0.3.0",
    "dag-cbor>=0.3.0",
    "py-cid>=0.3.0",
]
ipld = [
    "ipld-car>=0.0.1",  # CAR file format support
    "ipld-dag-pb>=0.0.1",  # DAG-PB codec for IPLD
    "dag-cbor>=0.2.0",  # Required by ipld-car
    "multiformats>=0.3.0",  # Enhanced multiformats support
    # Note: For IPLD UnixFS support, use the 'ipld-github' extra or install manually:
    # pip install git+https://github.com/storacha/py-ipld-unixfs.git
]
ipld-github = [
    # Source-checkout development extra only. Not the PCPR-051 release profile.
    # IPLD packages including GitHub-only dependencies
    # Install with: pip install -e .[ipld-github]
    "ipld-unixfs @ git+https://github.com/storacha/py-ipld-unixfs.git",
    # Include all standard IPLD packages too
    "ipld-car>=0.0.1",
    "ipld-dag-pb>=0.0.1", 
    "dag-cbor>=0.2.0",  # Required by ipld-car
    "multiformats>=0.3.0",
]
ipfs_datasets = [
    # Distributed dataset manipulation services
    # Install with: pip install -e .[ipfs_datasets]
    "ipfs_datasets_py",
    "datasets",
    "boto3>=1.26.0",
]

ipfs_accelerate = [
    # ipfs_accelerate_py integration (opt-in; heavy dependency stack)
    # Install with: pip install -e .[ipfs_accelerate]
    "ipfs_accelerate_py",
    "ipfs_model_manager_py",
    "libp2p_kit_py",
    "websocket-client",
    "torch>=2.0.0",
    "torchvision",
    "transformers>=4.20.0",
    "ipfs_transformers_py",
    "sentence-transformers",
    "InstructorEmbedding",
    "openvino",
    "openvino-genai",
    "optimum",
    "optimum-intel",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",  # Required for FastAPI template rendering
]
webrtc = [
    "aiortc>=1.5.0",
    "av>=10.0.0",  # Required by aiortc for media handling
    "opencv-python>=4.7.0",  # For video processing
    "websockets>=10.4",  # For WebSocket signaling
]
graphql = [
    "graphql-core>=3.2.0",
    "strawberry-graphql>=0.200.0",  # Modern GraphQL library
]
s3 = [
    "boto3>=1.26.0",
]
performance = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-trio>=0.8.0",
    "pytest-timeout>=2.3.0",
    "paramiko>=3.4.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "mypy>=1.3.0",
    "pylint>=2.17.0",
    "build>=0.10.0",
    "twine>=4.0.2",
    "playwright>=1.30.0",
    "pytest-playwright>=0.4.0",
    "rdflib>=7.0.0",
]
full = [
    # Core functionality
    "fsspec>=2023.3.0",
    "requests-unixsocket>=0.3.0",
    
    # Arrow/data processing
    "pyarrow>=11.0.0",
    "pandas>=1.3.0",
    
    # Networking and protocols. Mutable Git extras stay in named
    # source-checkout extras (libp2p, ipld-github), not this release extra.
    "multiformats>=0.2.0",
    "multiaddr>=0.0.9",
    "protobuf>=5.26.0,<7.0.0",
    "eth-hash[pycryptodome]>=0.3.3",
    "eth-keys>=0.4.0",
    
    # Core utilities
    "aiohttp>=3.8.4",
    "pyyaml>=6.0",
    "numpy>=1.20.0",
    
    # ML/AI
    "scikit-learn>=1.0.0",
    "faiss-cpu>=1.8.0",
    
    # API
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    
    # GraphQL
    "graphql-core>=3.2.0",
    
    # Performance and visualization
    "matplotlib>=3.5.0",

    # Knowledge graph / graph utilities
    "networkx>=3.0",

    # Websocket support
    "websockets>=10.4",
    
    # Cloud storage
    "boto3>=1.26.0",

    # ipfs_datasets_py integration
    "ipfs_datasets_py",
    "datasets",
    
    # HuggingFace
    "huggingface_hub>=0.19.0",
    
    # IPLD support (working packages)
    "ipld-car>=0.0.1",
    "ipld-dag-pb>=0.0.1",
    "dag-cbor>=0.2.0",
]

[project.scripts]
ipfs-kit = "ipfs_kit_py.cli:sync_main"
ipfs-kit-mcp = "ipfs_kit_py.mcp_server.server:main"
ipfs-kit-mcp-tools = "ipfs_kit_py.mcp_server.cli:main"
ipfs-kit-iroh = "ipfs_kit_py.iroh_install_cli:main"
ipfs-kit-iroh-ops = "ipfs_kit_py.iroh.cli:main"
ipfs-kit-iroh-diagnostics = "ipfs_kit_py.iroh.diagnostics_cli:main"
ipfs-kit-iroh-manifest = "ipfs_kit_py.iroh.manifest_cli:main"
ipfs-kit-iroh-interop = "ipfs_kit_py.iroh.multinode:main"
# Kernel VFS FUSE mount/doctor/status/unmount CLI (implementation: KVFS-702).
# Declared here so packaging metadata makes the mount CLI discoverable without
# pulling fusepy into the default wheel.
ipfs-kit-kernel-vfs = "ipfs_kit_py.cli.kernel_vfs:main"

[project.entry-points."fsspec.specs"]
iroh = "ipfs_kit_py.iroh_fsspec:IrohFileSystem"
"iroh+blob" = "ipfs_kit_py.iroh_fsspec:IrohFileSystem"

[project.urls]
Homepage = "https://github.com/endomorphosis/ipfs_kit_py/"
Documentation = "https://github.com/endomorphosis/ipfs_kit_py/blob/main/README.md"
Source = "https://github.com/endomorphosis/ipfs_kit_py/"
Issues = "https://github.com/endomorphosis/ipfs_kit_py/issues"
Changelog = "https://github.com/endomorphosis/ipfs_kit_py/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Kernel VFS packaging policy (KVFS-703)
# ---------------------------------------------------------------------------
# Default wheel: no fusepy / libfuse / WinFsp side effects.
# Optional [fuse] extra: pinned fusepy binding only (native drivers remain host).
# Windows OS classifier is receipt-gated: advertise only after a live WinFsp
# gate admits support. Until then the classifier must stay absent from
# [project.classifiers] even though hermetic Windows code paths exist.
[tool.ipfs_kit_py.kernel_vfs.packaging]
task_id = "KVFS-703"
schema = "KernelVFSPackagingPolicy@1"
fuse_extra = "fuse"
fuse_binding_requirement = "fusepy==3.0.1"
mount_cli_script = "ipfs-kit-kernel-vfs"
mount_cli_entry = "ipfs_kit_py.cli.kernel_vfs:main"
supported_python = ["3.12", "3.13"]
supported_platforms = ["linux", "windows"]
windows_os_classifier = "Operating System :: Microsoft :: Windows"
windows_classifier_policy = "live_gate_receipt"
windows_live_gate_env = "IPFS_KIT_KERNEL_VFS_WINDOWS_LIVE_GATE"
# Native support tier remains receipt-gated; package import is never capability.
import_is_not_capability = true
default_wheel_inert = true

[tool.ipfs_kit_py.clean-package]
schema = "ipfs_kit_py/assurance/clean-package@1"
interface = "KitCleanPackage@1"
task-id = "PCPR-051"
goal-id = "PCPR-G600"
requires-sibling-source-trees = false
requires-recursive-submodules = false
editable-local-dependencies = false
sys-path-injection = false
import-network = false
mutable-git-release-requires = false
runtime-requires-authority = "pyproject.toml:project.dependencies"
development-requirements-role = "source-checkout-development-and-integration"
named-git-extras-role = "source-checkout-development-and-integration"
named-git-extras = ["libp2p", "ipld-github"]
sibling-trees = ["ipfs_accelerate_py", "ipfs_datasets_py", ".tools"]
recursive-submodule-trees = ["py-ipld-car", "py-ipld-dag-pb", "py-ipld-unixfs"]

[tool.ipfs_kit_py.dependency-locks]
schema = "ipfs_kit_py/assurance/dependency-locks@1"
interface = "KitDependencyLocks@1"
task-id = "PCPR-053"
goal-id = "PCPR-G600"
lock-kind = "declared_release_profile"
profile = "release"
python-requires = ">=3.12"
requirements-authority = "pyproject.toml:project.dependencies"
named-git-extras-role = "source-checkout-development-and-integration"
